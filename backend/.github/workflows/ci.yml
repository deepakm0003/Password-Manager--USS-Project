    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare database
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE uam_ci;"
      - name: Run migrations
        run: npm run migrate:deploy
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        if: secrets.GHCR_TOKEN != '' && secrets.GHCR_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_USERNAME != '' }}
          tags: ghcr.io/${{ github.repository_owner }}/uam-backend:${{ github.sha }}

